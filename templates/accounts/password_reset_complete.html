{% extends "base.html" %}

{% block title %}Password Updated | ConnectCRM{% endblock %}

{% block auth_content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            <span class="auth-brand-icon">C</span>
            <span class="auth-brand-text">ConnectCRM</span>
        </div>

        <div class="auth-header">
            <p class="page-eyebrow">PASSWORD RESET</p>

            <h1>Password updated</h1>

            <p>
                Your password has been changed successfully.
            </p>
        </div>

        <a href="{% url 'accounts:login' %}" class="btn btn-primary auth-submit">
            Log in
        </a>

    </div>

</div>

{% endblock auth_content %}
