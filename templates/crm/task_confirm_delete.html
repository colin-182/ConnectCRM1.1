{% extends "base.html" %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Delete Task</h1>
        <p>Confirm that you want to remove this task.</p>
    </div>

</div>

<div class="content-card">

    <div class="delete-confirmation">

        <div class="delete-warning">

            <h2>Delete {{ task.title }}?</h2>

            <p>
                This action will permanently remove this task from your CRM.
            </p>

            <p>
                This cannot be undone.
            </p>

        </div>

        <form method="post">

            {% csrf_token %}

            <div class="form-actions">

                <a
                    href="{% url 'crm:task_detail' task.id %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Delete Task
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
